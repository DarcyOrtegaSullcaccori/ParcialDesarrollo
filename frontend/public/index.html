<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incidencias Viales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; -webkit-font-smoothing: antialiased; }
      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-light: #eff6ff;
        --success: #059669;
        --warning: #d97706;
        --danger: #dc2626;
        --gray-50: #f8fafc;
        --gray-100: #f1f5f9;
        --gray-200: #e2e8f0;
        --gray-400: #94a3b8;
        --gray-500: #64748b;
        --gray-700: #334155;
        --gray-900: #0f172a;
        --radius: 10px;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
        --shadow: 0 4px 16px rgba(0,0,0,.08);
        --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
      }
      a { color: var(--primary); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button { cursor: pointer; font-family: inherit; }
      input, select, textarea { font-family: inherit; }
    </style>
  </head>
  <body>
    <noscript>Necesita JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
